name: release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install

      # `release` runs `changeset publish`: it skips npm because the package is
      # private, and creates the git tag that marks the release.
      - name: Create Release PR or Tag
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
