# Target: .github/workflows/pull-request.yml
# The job id MUST be `code` — it supplies the first half of the required
# `code / all-checks` context. The callee supplies the second half.
# Every owner calls repobuddy/.github, pinned at the released tag v2.
name: pull-request

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
